name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node 24 offline contracts, syntax and skill freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - name: Record validated revision
        run: printf 'Validated `%s` with Node 24 offline tests, syntax checks and generated-skill freshness.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
